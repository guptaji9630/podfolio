services:
  - type: web
    name: excalidraw-mcp-server
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: EXPRESS_SERVER_URL
        sync: false
      - key: MCP_ADMIN_TOKEN
        sync: false
        generateValue: true
    healthCheckPath: /health
    autoDeploy: true
    # Enable WebSocket support
    # Note: WebSocket support must be enabled in Render dashboard